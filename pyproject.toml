[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tpclap-infer"
dynamic = ["version"]
description = "Standalone inference-only TP-CLAP conditioned audio retrieval embeddings"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Mohan Li"}, {name = "TP-CLAP contributors"}]
maintainers = [{name = "openmirlab"}]
dependencies = [
  "huggingface-hub>=0.34",
  "numpy>=2.0",
  "tomli>=2; python_version < '3.11'",
  "torch>=2.7",
  # Transformers 5.x has not passed CED remote-code parity; see docs/compatibility.md.
  "transformers>=4.57,<5",
]

[project.optional-dependencies]
audio = ["torchaudio>=2.7"]
dev = ["build>=1.3", "pytest>=8", "ruff>=0.8", "soundfile>=0.13", "torchaudio>=2.7"]

[tool.hatch.version]
path = "src/tpclap_infer/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tpclap_infer"]

[tool.hatch.build.targets.wheel.force-include]
"src/tpclap_infer/config/checkpoints.toml" = "tpclap_infer/config/checkpoints.toml"

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "README.md", "CLAUDE.md", "CHANGELOG.md", "LICENSE", "NOTICE", "pyproject.toml", ".gitignore", ".python-version"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: loads author checkpoints (~837 MiB each)"]
addopts = "-m 'not model'"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["src/tpclap_infer/_impl/"]
